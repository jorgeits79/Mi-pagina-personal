  <style>
    body {
      margin: 0;
      padding: 0;

      background: linear-gradient(135deg, #ffd6ec, #ffe6f0, #fff0f5);

      background-size: cover;
      color: #333;

      text-align: center;
      background-color: #ffffffcc;
      padding: 40px 20px;
      margin: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);

      width: 130px;
      margin-top: 15px;
    }

      font-size: 2.5em;
      color: #d63384;
      margin-bottom: 10px;
    }

      font-size: 1.1em;
    }

      background-color: #ffffffcc;
      margin: 30px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #c2185b;
    }

    ul {
      list-style: none;
      padding-left: 0;
    }

    ul li::before {
      content: "💖 ";
    }

    a {
      color: #ff4d6d;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
